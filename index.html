<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/app-icon/chatimall-icon.svg" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070A08" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://accounts.google.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>Chatimall | Say it. Grow it.</title>
  <meta name="description"
    content="Chatimall is a chat app for voice notes, live rooms, and the people you actually want to hear from." />
  <meta property="og:title" content="Chatimall | Say it. Grow it." />
  <meta property="og:description"
    content="Chatimall is a chat app for voice notes, live rooms, and the people you actually want to hear from." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chatimall | Say it. Grow it." />
  <meta name="twitter:description"
    content="Chatimall is a chat app for voice notes, live rooms, and the people you actually want to hear from." />
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root">
    <div
      id="startup-splash"
      role="status"
      aria-label="Loading Chatimall"
      style="position:fixed;inset:0;z-index:2147483647;background:#fff"
    >
      <picture>
        <source media="(prefers-color-scheme: dark) and (min-aspect-ratio: 1/1)" srcset="/splash/splash-dark-wide.png" />
        <source media="(prefers-color-scheme: dark)" srcset="/splash/splash-dark.png" />
        <source media="(min-aspect-ratio: 1/1)" srcset="/splash/splash-light-wide.png" />
        <img
          src="/splash/splash-light.png"
          alt=""
          style="display:block;width:100%;height:100%;object-fit:cover"
        />
      </picture>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
